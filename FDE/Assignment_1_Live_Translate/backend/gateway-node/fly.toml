app = "naveed-lt-gw"
primary_region = "sjc"

[build]

[env]
  # Reach the private AI service over Fly's internal network.
  AI_SERVICE_URL = "http://naveed-lt-ai.internal:8000"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
