primary_region = "sjc"

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "node src/runtime/server.js"

[env]
  NODE_ENV = "production"
  RUNTIME_HOST = "::"
  RUNTIME_PORT = "4200"
  HEALTHCHECK_URL = "http://127.0.0.1:4200/health"

[checks.runtime]
  type = "http"
  port = 4200
  method = "GET"
  path = "/health"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
