primary_region = "sjc"

[build]
  dockerfile = "../Dockerfile"

[processes]
  app = "node src/web/server.js"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HEALTHCHECK_URL = "http://127.0.0.1:3000/health"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
